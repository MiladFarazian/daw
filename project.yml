name: Gosan
options:
  bundleIdPrefix: com.miladfarazian
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  Gosan:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Gosan
        excludes:
          - "Gosan.entitlements"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: Gosan
        PRODUCT_BUNDLE_IDENTIFIER: com.miladfarazian.gosan
        CODE_SIGN_ENTITLEMENTS: Gosan/Gosan.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Milad Farazian"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.music"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Gosan records audio for your tracks."
