# Builds the Gosan macOS app. The Xcode project is generated from project.yml via
# XcodeGen, so we generate it, then compile with xcodebuild (no code signing on CI).
name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4
    - name: Install XcodeGen
      run: brew install xcodegen
    - name: Generate Xcode project
      run: xcodegen generate
    - name: Build
      run: |
        xcodebuild -project Gosan.xcodeproj -scheme Gosan -configuration Debug \
          -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
    - name: Verify audio export + project format
      run: make verify
